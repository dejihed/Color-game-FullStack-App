<div *ngIf="loading">Loading...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<div *ngIf="!loading && !error">
  <h3>All Users' Game Histories</h3>
  <table>
    <thead>
      <tr>
        <th>User ID</th>
        <th>Username</th>
        <th>Last Played</th>
        <th>Result</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let history of allUsersHistories">
        <td>{{ history.user.id }}</td>
        <td>{{ history.user.username }}</td>
        <td>{{ history.lastPlayed | date: 'short' }}</td>
        <td>{{ history.result }}</td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="!loading && !error && allUsersHistories.length === 0">
  <p>No game histories available.</p>
</div>

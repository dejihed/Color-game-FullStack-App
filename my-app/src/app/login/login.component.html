<div class="container">
  <div>
    <div class="card-body">
      <h1 style="margin-left: 330px;">Login</h1><br>
      <div>
        <div class="row justify-content-md-center">
          <div class="col-md-6">
            <form>
              <div class="form-group">
                <div class="text-err" *ngIf="loginError">
                  <p class="pp">Error: Invalid username or password</p>
                </div>
                <label style="padding-bottom: 10px;">Username</label>
                <div class="input-group">
                  <input 
                    type="text" 
                    name="username" 
                    class="form-control" 
                    [(ngModel)]="loginData.username" 
                    minlength="3" 
                    required 
                    (change)="reset()"
                  />
                </div>
              </div>
              <div class="form-group">
                <label style="padding-bottom: 10px;">Password</label>
                <div class="input-group">
                  <input 
                    type="password" 
                    name="password" 
                    class="form-control" 
                    [(ngModel)]="loginData.password" 
                    minlength="6" 
                    required 
                    (change)="reset()"
                  />
                </div>
              </div>
              <div>
                <button 
                  type="button" 
                  class="btn" 
                  style="background-color:blue; color: aliceblue;" 
                  (click)="connected()"
                >
                  Login
                </button>
                &nbsp;
                <button 
                  type="button" 
                  class="btn" 
                  style="background-color:rgb(25, 168, 44); color: aliceblue;" 
                  (click)="navigate()"
                >
                  Sign up
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
